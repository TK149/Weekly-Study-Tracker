<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weekly Focus & Timer Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      
      /* Status Colors */
      --color-not-started: #ef4444; /* Red */
      --color-running: #22c55e;     /* Green */
      --color-completed: #64748b;   /* Grey */
      --color-weekly: #38bdf8;      /* Light Blue */
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 { margin: 0 0 0.5rem 0; font-size: 2rem; }
    p { color: var(--text-muted); margin: 0; }

    /* Layout Structure */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    @media (max-width: 850px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    .main-column {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Side Panel */
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .panel-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem;
      border: 1px solid var(--border);
    }

    .panel-card h2 {
      margin-top: 0;
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .reset-note {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: normal;
    }

    /* Add Task Form */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 500px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    input, select {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-size: 0.95rem;
      width: 100%;
    }

    .day-checkboxes {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .day-checkboxes label {
      font-size: 0.8rem;
      background: #0f172a;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }

    .btn-add {
      background: var(--color-weekly);
      color: #0f172a;
      font-weight: bold;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-add:hover { opacity: 0.9; }

    /* Filter Tabs */
    .filter-bar {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-weight: 600;
      border-radius: 6px;
    }

    .filter-btn.active {
      background: var(--card-bg);
      color: var(--text);
    }

    /* Task Cards */
    .tasks-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .task-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem;
      border-left: 6px solid var(--color-not-started);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .task-card.status-not-started { border-left-color: var(--color-not-started); }
    .task-card.status-running {
      border-left-color: var(--color-running);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.15);
    }
    .task-card.status-completed {
      border-left-color: var(--color-completed);
      opacity: 0.85;
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .task-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      color: #fff;
    }

    .status-not-started .status-badge { background: var(--color-not-started); }
    .status-running .status-badge { background: var(--color-running); color: #000; }
    .status-completed .status-badge { background: var(--color-completed); }

    .days-tag {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    /* Progress Bars */
    .progress-container {
      margin: 1rem 0;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 0.3rem;
      color: var(--text-muted);
    }

    .progress-track {
      background: #0f172a;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .status-not-started .progress-fill { background-color: var(--color-not-started); }
    .status-running .progress-fill { background-color: var(--color-running); }
    .status-completed .progress-fill { background-color: var(--color-completed); }

    /* Weekly Goal Card Specifics */
    .weekly-item {
      background: #0f172a;
      border-radius: 8px;
      padding: 0.9rem;
      margin-bottom: 0.8rem;
      border: 1px solid var(--border);
    }

    .weekly-item-title {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 0.4rem;
    }

    .weekly-fill {
      background-color: var(--color-weekly);
    }

    /* Controls */
    .timer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
    }

    .timer-display {
      font-size: 1.75rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .controls { display: flex; gap: 0.5rem; }

    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-action { background: var(--color-not-started); color: white; }
    .status-running .btn-action { background: var(--color-running); color: black; }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-secondary:hover { color: var(--text); border-color: var(--text); }

    .btn-danger {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
    }
    .btn-danger:hover { background: #ef4444; color: white; }

    .empty-state {
      text-align: center;
      padding: 2rem;
      background: var(--card-bg);
      border-radius: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>Weekly Focus Dashboard</h1>
    <p id="today-display">Loading day...</p>
  </header>

  <div class="dashboard-grid">
    
    <!-- Main Column: Creation Form & Timers -->
    <div class="main-column">
      
      <!-- Add Timer Form -->
      <div class="panel-card">
        <h2>➕ Add New Custom Timer</h2>
        <form id="add-task-form">
          <div class="form-grid">
            <input type="text" id="task-name-input" placeholder="Timer Name (e.g. Class ABC)" required />
            <input type="number" id="weekly-goal-input" min="1" placeholder="Weekly Goal (Hours)" required />
          </div>

          <div class="form-grid">
            <div style="display: flex; gap: 0.5rem; align-items: center;">
              <span style="font-size: 0.85rem; color: var(--text-muted);">Daily Time:</span>
              <input type="number" id="hours-input" min="0" max="23" placeholder="Hrs" required />
              <input type="number" id="mins-input" min="0" max="59" placeholder="Mins" required />
            </div>
          </div>

          <div class="day-checkboxes">
            <label><input type="checkbox" value="1" class="day-check" checked> Mon</label>
            <label><input type="checkbox" value="2" class="day-check" checked> Tue</label>
            <label><input type="checkbox" value="3" class="day-check" checked> Wed</label>
            <label><input type="checkbox" value="4" class="day-check" checked> Thu</label>
            <label><input type="checkbox" value="5" class="day-check"> Fri</label>
            <label><input type="checkbox" value="6" class="day-check"> Sat</label>
            <label><input type="checkbox" value="0" class="day-check"> Sun</label>
          </div>

          <button type="submit" class="btn-add">Add Timer</button>
        </form>
      </div>

      <!-- Filter Tabs -->
      <div class="filter-bar">
        <button class="filter-btn active" id="filter-today" onclick="setFilter('today')">Today's Timers</button>
        <button class="filter-btn" id="filter-all" onclick="setFilter('all')">All Timers</button>
      </div>

      <!-- Task List Container -->
      <div class="tasks-list" id="tasks-container"></div>

    </div>

    <!-- Side Panel: Weekly Goals Summary -->
    <div class="side-panel">
      <div class="panel-card">
        <h2>
          📊 Weekly Goals
          <span class="reset-note">Resets Sat Midnight</span>
        </h2>
        <div id="weekly-goals-container"></div>
      </div>
    </div>

  </div>

  <script>
    const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const todayIndex = new Date().getDay();

    // Data State (Starts empty so friends get a clean base template)
    let tasks = JSON.parse(localStorage.getItem('custom_timers_list')) || [];

    let activeFilter = 'today';
    let runningIntervals = {};

    function getWeekIdentifier() {
      const d = new Date();
      const distanceToSat = 6 - d.getDay();
      const saturday = new Date(d);
      saturday.setDate(d.getDate() + distanceToSat);
      saturday.setHours(23, 59, 59, 999);
      return saturday.toDateString();
    }

    function checkResets() {
      const todayStr = new Date().toDateString();
      const currentWeekId = getWeekIdentifier();

      tasks.forEach(task => {
        if (task.lastActiveDate !== todayStr) {
          task.remainingSeconds = task.totalSeconds;
          task.status = 'not-started';
          task.lastActiveDate = todayStr;
        }

        if (!task.lastResetWeek || task.lastResetWeek !== currentWeekId) {
          task.weeklyAccumulatedSecs = 0;
          task.lastResetWeek = currentWeekId;
        }
      });
      saveTasks();
    }

    function saveTasks() {
      localStorage.setItem('custom_timers_list', JSON.stringify(tasks));
    }

    document.getElementById('today-display').textContent = 
      `Today is ${new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' })}`;

    document.getElementById('add-task-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('task-name-input').value.trim();
      const weeklyGoal = parseFloat(document.getElementById('weekly-goal-input').value) || 0;
      const hrs = parseInt(document.getElementById('hours-input').value) || 0;
      const mins = parseInt(document.getElementById('mins-input').value) || 0;
      
      const selectedDays = Array.from(document.querySelectorAll('.day-check:checked'))
                               .map(cb => parseInt(cb.value));

      if (hrs === 0 && mins === 0) {
        alert("Please set a daily duration greater than 0.");
        return;
      }

      if (selectedDays.length === 0) {
        alert("Please select at least one day for this timer.");
        return;
      }

      const totalSeconds = (hrs * 3600) + (mins * 60);

      const newTask = {
        id: 'task_' + Date.now(),
        name: name,
        totalSeconds: totalSeconds,
        remainingSeconds: totalSeconds,
        weeklyGoalHours: weeklyGoal,
        weeklyAccumulatedSecs: 0,
        days: selectedDays,
        status: 'not-started',
        lastActiveDate: new Date().toDateString(),
        lastResetWeek: getWeekIdentifier()
      };

      tasks.push(newTask);
      saveTasks();
      renderTasks();
      renderWeeklyGoals();

      document.getElementById('add-task-form').reset();
      document.querySelectorAll('.day-check').forEach((cb, idx) => cb.checked = idx < 4);
    });

    function setFilter(filter) {
      activeFilter = filter;
      document.getElementById('filter-today').classList.toggle('active', filter === 'today');
      document.getElementById('filter-all').classList.toggle('active', filter === 'all');
      renderTasks();
    }

    function toggleTimer(id) {
      const task = tasks.find(t => t.id === id);
      if (!task || task.remainingSeconds <= 0) return;

      if (task.status === 'running') {
        clearInterval(runningIntervals[id]);
        delete runningIntervals[id];
        task.status = task.remainingSeconds === 0 ? 'completed' : 'not-started';
      } else {
        task.status = 'running';
        runningIntervals[id] = setInterval(() => {
          if (task.remainingSeconds > 0) {
            task.remainingSeconds--;
            task.weeklyAccumulatedSecs++;

            if (task.remainingSeconds === 0) {
              clearInterval(runningIntervals[id]);
              delete runningIntervals[id];
              task.status = 'completed';
              alert(`🎉 "${task.name}" is fully drained for today!`);
            }
            saveTasks();
            renderTasks();
            renderWeeklyGoals();
          }
        }, 1000);
      }
      saveTasks();
      renderTasks();
      renderWeeklyGoals();
    }

    function resetTimer(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      if (runningIntervals[id]) {
        clearInterval(runningIntervals[id]);
        delete runningIntervals[id];
      }

      task.remainingSeconds = task.totalSeconds;
      task.status = 'not-started';
      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      if (confirm("Are you sure you want to delete this timer?")) {
        if (runningIntervals[id]) {
          clearInterval(runningIntervals[id]);
          delete runningIntervals[id];
        }
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        renderTasks();
        renderWeeklyGoals();
      }
    }

    function formatTime(secs) {
      const h = String(Math.floor(secs / 3600)).padStart(2, '0');
      const m = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
      const s = String(secs % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function formatHoursMinutes(totalSecs) {
      const h = (totalSecs / 3600).toFixed(1);
      return `${h} hrs`;
    }

    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';

      let filteredTasks = tasks;
      if (activeFilter === 'today') {
        filteredTasks = tasks.filter(t => t.days.includes(todayIndex));
      }

      if (filteredTasks.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            ${activeFilter === 'today' ? "🎉 No timers scheduled for today!" : "No custom timers created yet."}
          </div>
        `;
        return;
      }

      filteredTasks.forEach(task => {
        const drainedSeconds = task.totalSeconds - task.remainingSeconds;
        const progressPct = Math.min(100, Math.round((drainedSeconds / task.totalSeconds) * 100));
        const dayLabels = task.days.map(d => DAY_NAMES[d]).join(', ');

        const card = document.createElement('div');
        card.className = `task-card status-${task.status}`;

        let statusText = "Red (Not Started)";
        if (task.status === 'running') statusText = "Green (Working)";
        if (task.status === 'completed') statusText = "Grey (Complete)";

        card.innerHTML = `
          <div class="task-header">
            <span class="task-title">${task.name}</span>
            <span class="status-badge">${statusText}</span>
          </div>
          
          <div class="days-tag">Scheduled: ${dayLabels}</div>

          <div class="progress-container">
            <div class="progress-info">
              <span>Progress</span>
              <span><strong>${progressPct}%</strong></span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width: ${progressPct}%"></div>
            </div>
          </div>

          <div class="timer-row">
            <div class="timer-display">${formatTime(task.remainingSeconds)}</div>
            <div class="controls">
              ${task.status !== 'completed' ? `
                <button class="btn btn-action" onclick="toggleTimer('${task.id}')">
                  ${task.status === 'running' ? 'Pause' : 'Start'}
                </button>
              ` : ''}
              <button class="btn btn-secondary" onclick="resetTimer('${task.id}')">Reset</button>
              <button class="btn btn-danger" onclick="deleteTask('${task.id}')">🗑️</button>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function renderWeeklyGoals() {
      const container = document.getElementById('weekly-goals-container');
      container.innerHTML = '';

      if (tasks.length === 0) {
        container.innerHTML = `<div class="empty-state">No goals set yet.</div>`;
        return;
      }

      tasks.forEach(task => {
        const goalSecs = (task.weeklyGoalHours || 1) * 3600;
        const currentSecs = task.weeklyAccumulatedSecs || 0;
        const pct = Math.min(100, Math.round((currentSecs / goalSecs) * 100));

        const item = document.createElement('div');
        item.className = 'weekly-item';
        item.innerHTML = `
          <div class="weekly-item-title">${task.name}</div>
          <div class="progress-info">
            <span>Done: ${formatHoursMinutes(currentSecs)}</span>
            <span>Goal: ${task.weeklyGoalHours} hrs (${pct}%)</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill weekly-fill" style="width: ${pct}%"></div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    checkResets();
    renderTasks();
    renderWeeklyGoals();
  </script>
</body>
</html>
