<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study Timer Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      
      /* Status Colors */
      --color-not-started: #ef4444; /* Red */
      --color-in-progress: #eab308; /* Yellow */
      --color-running: #22c55e;     /* Green */
      --color-completed: #64748b;   /* Grey */
      --color-weekly: #38bdf8;      /* Light Blue */
      --color-daily: #a855f7;       /* Purple */
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
    }

    h1 { margin: 0 0 0.5rem 0; font-size: 2rem; }
    p { color: var(--text-muted); margin: 0; }

    /* Main Page Fullscreen Button */
    .btn-enter-fs {
      position: absolute;
      top: 0;
      right: 0;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s;
    }
    .btn-enter-fs:hover {
      color: var(--text);
      border-color: var(--text);
    }

    /* Layout Structure - 3 Column Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 280px 1fr 340px;
      gap: 1.5rem;
      max-width: 1450px;
      margin: 0 auto;
    }

    @media (max-width: 1150px) {
      .dashboard-grid { grid-template-columns: 280px 1fr; }
      .side-panel { grid-column: span 2; }
    }

    @media (max-width: 850px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .side-panel { grid-column: span 1; }
    }

    .left-panel, .main-column, .side-panel {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .panel-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem;
      border: 1px solid var(--border);
    }

    .panel-card h2 {
      margin-top: 0;
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Study Agenda / Notepad Styles */
    .agenda-subheading { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1rem; }
    .agenda-list { display: flex; flex-direction: column; gap: 0.55rem; }
    .agenda-item {
      display: flex; align-items: flex-start; gap: 0.5rem; background: #0f172a;
      padding: 0.5rem 0.6rem; border-radius: 6px; border: 1px solid var(--border);
      transition: border-color 0.2s;
    }
    .agenda-item:focus-within { border-color: var(--color-weekly); }
    .agenda-checkbox {
      appearance: none; -webkit-appearance: none; width: 18px; height: 18px;
      border: 2px solid var(--text-muted); border-radius: 4px; cursor: pointer;
      margin-top: 2px; flex-shrink: 0; display: grid; place-content: center;
      transition: all 0.2s ease;
    }
    .agenda-checkbox:checked { background-color: var(--color-running); border-color: var(--color-running); }
    .agenda-checkbox:checked::before { content: "✓"; color: #000; font-size: 12px; font-weight: bold; }
    
    .agenda-text {
      flex: 1; background: transparent; border: none; color: var(--text);
      font-family: inherit; font-size: 0.9rem; line-height: 1.4; resize: none;
      outline: none; padding: 0; overflow: hidden;
    }
    .agenda-item.completed .agenda-text { text-decoration: line-through; color: var(--text-muted); }
    .btn-delete-agenda { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; padding: 0 0.2rem; opacity: 0.4; transition: opacity 0.2s, color 0.2s; }
    .btn-delete-agenda:hover { opacity: 1; color: #ef4444; }
    .btn-add-agenda {
      margin-top: 0.75rem; background: transparent; border: 1px dashed var(--border);
      color: var(--text-muted); padding: 0.5rem; border-radius: 6px; cursor: pointer;
      font-size: 0.85rem; width: 100%; text-align: center; transition: all 0.2s;
    }
    .btn-add-agenda:hover { border-color: var(--color-weekly); color: var(--color-weekly); }
    .reset-note { font-size: 0.75rem; color: var(--text-muted); font-weight: normal; }

    /* Minimizable Add Timer Panel */
    .form-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .form-header h2 { margin: 0; }
    .btn-toggle-form { background: #0f172a; border: 1px solid var(--border); color: var(--text-muted); padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
    #add-form-content { margin-top: 1rem; display: none; }
    #add-form-content.expanded { display: block; }

    /* Add Task Form Elements */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }
    @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }
    input, select { background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 0.6rem 0.8rem; border-radius: 6px; font-size: 0.95rem; width: 100%; }
    .day-checkboxes { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .day-checkboxes label { font-size: 0.8rem; background: #0f172a; padding: 0.35rem 0.5rem; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 0.2rem; }
    .btn-add { background: var(--color-weekly); color: #0f172a; font-weight: bold; border: none; padding: 0.75rem; border-radius: 6px; width: 100%; cursor: pointer; font-size: 0.95rem; }
    .btn-add:hover { opacity: 0.9; }

    /* Filter Tabs */
    .filter-bar { display: flex; gap: 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    .filter-btn { background: transparent; border: none; color: var(--text-muted); padding: 0.5rem 1rem; cursor: pointer; font-weight: 600; border-radius: 6px; }
    .filter-btn.active { background: var(--card-bg); color: var(--text); }

    /* Task Cards */
    .tasks-list { display: flex; flex-direction: column; gap: 1rem; }
    .task-card { background: var(--card-bg); border-radius: 12px; padding: 1.25rem; border-left: 6px solid var(--color-not-started); transition: border-color 0.3s ease, box-shadow 0.3s ease; position: relative; }
    .task-card.status-not-started { border-left-color: var(--color-not-started); }
    .task-card.status-in-progress { border-left-color: var(--color-in-progress); }
    .task-card.status-running { border-left-color: var(--color-running); box-shadow: 0 0 12px rgba(34, 197, 94, 0.15); }
    .task-card.status-completed { border-left-color: var(--color-completed); opacity: 0.85; }
    .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; padding-right: 2rem; }
    .task-title-wrap { display: flex; align-items: center; gap: 0.5rem; }
    .task-title { font-size: 1.2rem; font-weight: 700; }
    .btn-edit { background: transparent; border: none; cursor: pointer; font-size: 0.95rem; opacity: 0.7; transition: opacity 0.2s; }
    .btn-edit:hover { opacity: 1; }
    
    .status-badge { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; padding: 0.2rem 0.5rem; border-radius: 4px; color: #fff; }
    .status-not-started .status-badge { background: var(--color-not-started); }
    .status-in-progress .status-badge { background: var(--color-in-progress); color: #000; }
    .status-running .status-badge { background: var(--color-running); color: #000; }
    .status-completed .status-badge { background: var(--color-completed); }

    .days-tag { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem; }
    .progress-container { margin: 1rem 0; }
    .progress-info { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.3rem; color: var(--text-muted); }
    .progress-track { background: #0f172a; height: 12px; border-radius: 6px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; transition: width 0.3s ease, background-color 0.3s ease; }
    .status-not-started .progress-fill { background-color: var(--color-not-started); }
    .status-in-progress .progress-fill { background-color: var(--color-in-progress); }
    .status-running .progress-fill { background-color: var(--color-running); }
    .status-completed .progress-fill { background-color: var(--color-completed); }

    /* Goal Widgets */
    .goal-summary-card { background: #0f172a; border-radius: 8px; padding: 0.9rem; margin-bottom: 1rem; border: 1px solid var(--border); }
    .goal-summary-title { font-weight: 800; font-size: 0.95rem; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .goal-item { background: #0f172a; border-radius: 8px; padding: 0.75rem; margin-bottom: 0.6rem; border: 1px solid var(--border); }
    .goal-item-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 0.3rem; }
    .summary-fill { background-color: var(--color-running) !important; }
    .weekly-fill { background-color: var(--color-weekly); }
    .daily-fill { background-color: var(--color-daily); }

    /* Controls & Displays */
    .timer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .timer-left-group { display: flex; align-items: center; gap: 0.75rem; }
    .timer-display { font-size: 1.75rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .elapsed-box { font-size: 0.75rem; background: #334155; color: #94a3b8; padding: 0.25rem 0.5rem; border-radius: 4px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .controls { display: flex; gap: 0.5rem; }
    
    .btn { padding: 0.5rem 1rem; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
    .btn-action { background: var(--color-not-started); color: white; }
    .status-in-progress .btn-action { background: var(--color-in-progress); color: black; }
    .status-running .btn-action { background: var(--color-running); color: black; }

    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
    .btn-secondary:hover { color: var(--text); border-color: var(--text); }
    .btn-danger { background: transparent; border: 1px solid #ef4444; color: #ef4444; }
    .btn-danger:hover { background: #ef4444; color: white; }

    .empty-state { text-align: center; padding: 1.5rem; background: var(--card-bg); border-radius: 12px; color: var(--text-muted); font-size: 0.9rem; }

    /* ========================================================
       FULLSCREEN OVERLAY STYLES 
       ======================================================== */
    #fs-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
    }
    
    #fs-overlay.hidden { display: none; }
    
    .fs-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0;
    }

    .fs-dropdown-wrapper {
      background-color: var(--color-running); /* Green background to match design */
      padding: 1rem 3rem 1rem 1rem;
      clip-path: polygon(0 0, 100% 0, 80% 100%, 0% 100%);
    }

    #fs-timer-select {
      background: transparent;
      color: #000;
      border: none;
      font-size: 1.8rem;
      font-weight: 900;
      text-transform: uppercase;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }

    .fs-close-btn {
      background: transparent;
      color: var(--color-not-started);
      border: 3px dashed var(--color-not-started);
      font-size: 1.2rem;
      font-weight: bold;
      width: 50px;
      height: 50px;
      margin: 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    
    .fs-close-btn:hover {
      background: var(--color-not-started);
      color: #fff;
    }

    .fs-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #fs-huge-timer {
      font-size: 16vw; /* Massive scalable text */
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      user-select: none;
      line-height: 1;
      transition: opacity 0.2s, color 0.2s;
    }
    
    #fs-huge-timer:active { opacity: 0.7; }
    #fs-huge-timer:hover { text-shadow: 0 0 20px rgba(255,255,255,0.1); }

    .fs-hint-text {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    .fs-toggle-group {
      display: flex;
      gap: 1rem;
    }

    .fs-toggle-btn {
      background: transparent;
      border: 3px solid var(--text);
      color: var(--text-muted);
      font-size: 1.5rem;
      padding: 0.8rem 2.5rem;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .fs-toggle-btn.active {
      background: var(--text);
      color: var(--bg);
    }
  </style>
</head>
<body>

  <header>
    <h1>Study Timer Dashboard</h1>
    <p id="today-display">Loading day...</p>
    <button class="btn-enter-fs" onclick="openFullscreen()" title="Open Fullscreen Mode">⛶</button>
  </header>

  <div class="dashboard-grid">
    
    <!-- Left Panel: Study Session Agenda Notepad -->
    <div class="left-panel">
      <div class="panel-card">
        <h2>📝 Study Session Agenda</h2>
        <div class="agenda-subheading">(Goals to hit in this session)</div>
        <div id="agenda-container"></div>
        <button class="btn-add-agenda" onclick="addAgendaItem()">+ Add Goal</button>
      </div>
    </div>

    <!-- Main Column -->
    <div class="main-column">
      
      <!-- Filter Tabs -->
      <div class="filter-bar">
        <button class="filter-btn active" id="filter-today" onclick="setFilter('today')">Today's Timers</button>
        <button class="filter-btn" id="filter-all" onclick="setFilter('all')">All Timers</button>
      </div>

      <!-- Task List Container -->
      <div class="tasks-list" id="tasks-container"></div>

      <!-- Minimizable Add Timer Widget (At Bottom) -->
      <div class="panel-card">
        <div class="form-header" onclick="toggleAddForm()">
          <h2>➕ Add New Custom Timer</h2>
          <button type="button" class="btn-toggle-form" id="form-toggle-btn">Expand ▼</button>
        </div>
        
        <div id="add-form-content">
          <form id="add-task-form">
            <div class="form-grid">
              <input type="text" id="task-name-input" placeholder="Timer Name (e.g. Class ABC)" required />
              <input type="number" id="weekly-goal-input" min="0.5" step="0.5" placeholder="Weekly Goal (Hours)" required />
            </div>

            <div class="form-grid">
              <div style="display: flex; gap: 0.5rem; align-items: center;">
                <span style="font-size: 0.85rem; color: var(--text-muted);">Daily Time:</span>
                <input type="number" id="hours-input" min="0" max="23" placeholder="Hrs" required />
                <input type="number" id="mins-input" min="0" max="59" placeholder="Mins" required />
              </div>
            </div>

            <div class="day-checkboxes">
              <label><input type="checkbox" value="1" class="day-check" checked> Mon</label>
              <label><input type="checkbox" value="2" class="day-check" checked> Tue</label>
              <label><input type="checkbox" value="3" class="day-check" checked> Wed</label>
              <label><input type="checkbox" value="4" class="day-check" checked> Thu</label>
              <label><input type="checkbox" value="5" class="day-check"> Fri</label>
              <label><input type="checkbox" value="6" class="day-check"> Sat</label>
              <label><input type="checkbox" value="0" class="day-check"> Sun</label>
            </div>

            <button type="submit" class="btn-add">Add Timer</button>
          </form>
        </div>
      </div>

    </div>

    <!-- Side Panel -->
    <div class="side-panel">
      
      <!-- Weekly Goals Panel -->
      <div class="panel-card">
        <h2>
          📊 Weekly Goals
          <span class="reset-note">Resets Sat Midnight</span>
        </h2>
        <div id="weekly-summary-container"></div>
        <div id="weekly-goals-container"></div>
      </div>

      <!-- Daily Goals Panel -->
      <div class="panel-card">
        <h2>
          🎯 Daily Goals
          <span class="reset-note">Resets Midnight</span>
        </h2>
        <div id="daily-summary-container"></div>
        <div id="daily-goals-container"></div>
      </div>

    </div>
  </div>

  <!-- ========================================================
       FULLSCREEN OVERLAY COMPONENT
       ======================================================== -->
  <div id="fs-overlay" class="hidden">
    <div class="fs-header">
      <div class="fs-dropdown-wrapper">
        <select id="fs-timer-select" onchange="updateFsDisplay()"></select>
      </div>
      <button class="fs-close-btn" onclick="closeFullscreen()" title="Exit Fullscreen">🗙</button>
    </div>
    
    <div class="fs-body">
      <div class="fs-hint-text">(Click Timer to Start/Pause)</div>
      <div id="fs-huge-timer" onclick="toggleActiveFsTimer()">00:00:00</div>
      
      <div class="fs-toggle-group">
        <button id="fs-btn-remaining" class="fs-toggle-btn active" onclick="setFsMode('remaining')">Remaining</button>
        <button id="fs-btn-elapsed" class="fs-toggle-btn" onclick="setFsMode('elapsed')">Elapsed</button>
      </div>
    </div>
  </div>

  <script>
    const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const todayIndex = new Date().getDay();

    let tasks = JSON.parse(localStorage.getItem('custom_timers_list')) || [];
    let activeFilter = 'today';
    let runningIntervals = {};

    /* --- Agenda / Notepad Feature --- */
    let agendaItems = JSON.parse(localStorage.getItem('study_session_agenda'));
    if (!agendaItems || !Array.isArray(agendaItems) || agendaItems.length === 0) {
      agendaItems = [
        { id: 'agenda_' + Date.now(), text: '', completed: false }
      ];
    }

    function saveAgenda() {
      localStorage.setItem('study_session_agenda', JSON.stringify(agendaItems));
    }

    function autoResizeTextarea(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    function renderAgenda(focusId = null) {
      const container = document.getElementById('agenda-container');
      container.innerHTML = '';

      const list = document.createElement('div');
      list.className = 'agenda-list';

      agendaItems.forEach((item, index) => {
        const itemEl = document.createElement('div');
        itemEl.className = `agenda-item ${item.completed ? 'completed' : ''}`;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'agenda-checkbox';
        checkbox.checked = item.completed;
        checkbox.addEventListener('change', (e) => {
          item.completed = e.target.checked;
          saveAgenda();
          renderAgenda();
        });

        const textarea = document.createElement('textarea');
        textarea.className = 'agenda-text';
        textarea.rows = 1;
        textarea.value = item.text;
        textarea.placeholder = 'Type goal here...';

        setTimeout(() => autoResizeTextarea(textarea), 0);

        textarea.addEventListener('input', (e) => {
          item.text = e.target.value;
          autoResizeTextarea(e.target);
          saveAgenda();
        });

        textarea.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            const newId = 'agenda_' + Date.now();
            agendaItems.splice(index + 1, 0, { id: newId, text: '', completed: false });
            saveAgenda();
            renderAgenda(newId);
          } else if (e.key === 'Backspace' && textarea.value === '' && agendaItems.length > 1) {
            e.preventDefault();
            agendaItems.splice(index, 1);
            saveAgenda();
            const prevId = agendaItems[Math.max(0, index - 1)]?.id;
            renderAgenda(prevId);
          }
        });

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-delete-agenda';
        delBtn.innerHTML = '✕';
        delBtn.title = 'Delete item';
        delBtn.addEventListener('click', () => {
          if (agendaItems.length > 1) {
            agendaItems.splice(index, 1);
          } else {
            agendaItems[0].text = '';
            agendaItems[0].completed = false;
          }
          saveAgenda();
          renderAgenda();
        });

        itemEl.appendChild(checkbox);
        itemEl.appendChild(textarea);
        itemEl.appendChild(delBtn);
        list.appendChild(itemEl);
      });

      container.appendChild(list);

      if (focusId) {
        const textareas = container.querySelectorAll('.agenda-text');
        agendaItems.forEach((item, idx) => {
          if (item.id === focusId && textareas[idx]) {
            textareas[idx].focus();
          }
        });
      }
    }

    function addAgendaItem() {
      const newId = 'agenda_' + Date.now();
      agendaItems.push({ id: newId, text: '', completed: false });
      saveAgenda();
      renderAgenda(newId);
    }
    /* --- End Agenda Feature --- */

    function getWeekIdentifier() {
      const d = new Date();
      const distanceToSat = 6 - d.getDay();
      const saturday = new Date(d);
      saturday.setDate(d.getDate() + distanceToSat);
      saturday.setHours(23, 59, 59, 999);
      return saturday.toDateString();
    }

    function checkResets() {
      const todayStr = new Date().toDateString();
      const currentWeekId = getWeekIdentifier();

      tasks.forEach(task => {
        if (task.dailyAccumulatedSecs === undefined) {
          task.dailyAccumulatedSecs = task.totalSeconds - task.remainingSeconds;
        }

        if (task.lastActiveDate !== todayStr) {
          task.remainingSeconds = task.totalSeconds;
          task.dailyAccumulatedSecs = 0;
          task.status = 'not-started';
          task.lastActiveDate = todayStr;
          task.lastTickTime = null;
        }

        if (!task.lastResetWeek || task.lastResetWeek !== currentWeekId) {
          task.weeklyAccumulatedSecs = 0;
          task.lastResetWeek = currentWeekId;
        }
      });
      saveTasks();
    }

    function saveTasks() {
      localStorage.setItem('custom_timers_list', JSON.stringify(tasks));
    }

    function toggleAddForm() {
      const content = document.getElementById('add-form-content');
      const btn = document.getElementById('form-toggle-btn');
      const isExpanded = content.classList.toggle('expanded');
      btn.textContent = isExpanded ? "Collapse ▲" : "Expand ▼";
    }

    document.getElementById('today-display').textContent = 
      `Today is ${new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' })}`;

    document.getElementById('add-task-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('task-name-input').value.trim();
      const weeklyGoal = parseFloat(document.getElementById('weekly-goal-input').value) || 0;
      const hrs = parseInt(document.getElementById('hours-input').value) || 0;
      const mins = parseInt(document.getElementById('mins-input').value) || 0;
      
      const selectedDays = Array.from(document.querySelectorAll('.day-check:checked'))
                                .map(cb => parseInt(cb.value));

      if (hrs === 0 && mins === 0) {
        alert("Please set a daily duration greater than 0.");
        return;
      }

      if (selectedDays.length === 0) {
        alert("Please select at least one day for this timer.");
        return;
      }

      const totalSeconds = (hrs * 3600) + (mins * 60);

      const newTask = {
        id: 'task_' + Date.now(),
        name: name,
        totalSeconds: totalSeconds,
        remainingSeconds: totalSeconds,
        dailyAccumulatedSecs: 0,
        weeklyGoalHours: weeklyGoal,
        weeklyAccumulatedSecs: 0,
        days: selectedDays,
        status: 'not-started',
        lastActiveDate: new Date().toDateString(),
        lastResetWeek: getWeekIdentifier(),
        lastTickTime: null
      };

      tasks.push(newTask);
      saveTasks();
      renderTasks();
      renderWeeklyGoals();
      renderDailyGoals();

      document.getElementById('add-task-form').reset();
      document.querySelectorAll('.day-check').forEach((cb, idx) => cb.checked = idx < 4);
      toggleAddForm();
    });

    function editTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      const newName = prompt("Enter new name for this timer:", task.name);
      if (newName === null) return;

      const currentHrs = Math.floor(task.totalSeconds / 3600);
      const currentMins = Math.floor((task.totalSeconds % 3600) / 60);

      const newHrsInput = prompt("Enter daily hours target:", currentHrs);
      if (newHrsInput === null) return;

      const newMinsInput = prompt("Enter daily minutes target:", currentMins);
      if (newMinsInput === null) return;

      const newWeeklyGoalInput = prompt("Enter weekly goal (hours):", task.weeklyGoalHours);
      if (newWeeklyGoalInput === null) return;

      const hrs = parseInt(newHrsInput) || 0;
      const mins = parseInt(newMinsInput) || 0;
      const weeklyGoal = parseFloat(newWeeklyGoalInput) || 0;

      if (hrs === 0 && mins === 0) {
        alert("Daily goal must be greater than 0 minutes.");
        return;
      }

      const newTotalSecs = (hrs * 3600) + (mins * 60);

      task.name = newName.trim() || task.name;
      task.weeklyGoalHours = weeklyGoal;
      
      if (newTotalSecs !== task.totalSeconds) {
        task.totalSeconds = newTotalSecs;
        task.remainingSeconds = Math.min(task.remainingSeconds, newTotalSecs);
      }

      saveTasks();
      renderTasks();
      renderWeeklyGoals();
      renderDailyGoals();
    }

    function setFilter(filter) {
      activeFilter = filter;
      document.getElementById('filter-today').classList.toggle('active', filter === 'today');
      document.getElementById('filter-all').classList.toggle('active', filter === 'all');
      renderTasks();
    }

    function updateTimerProgress(id) {
      const task = tasks.find(t => t.id === id);
      if (!task || task.status !== 'running') return;

      const now = Date.now();
      if (!task.lastTickTime) {
        task.lastTickTime = now;
        return;
      }

      const elapsedSecs = Math.floor((now - task.lastTickTime) / 1000);

      if (elapsedSecs >= 1) {
        const actualDeduction = Math.min(task.remainingSeconds, elapsedSecs);
        
        task.remainingSeconds -= actualDeduction;
        task.dailyAccumulatedSecs += actualDeduction;
        task.weeklyAccumulatedSecs += actualDeduction;
        task.lastTickTime += actualDeduction * 1000;

        if (task.remainingSeconds <= 0) {
          clearInterval(runningIntervals[id]);
          delete runningIntervals[id];
          task.status = 'completed';
          task.remainingSeconds = 0;
          task.lastTickTime = null;
          alert(`🎉 "${task.name}" is fully drained for today!`);
        }

        saveTasks();
        renderTasks();
        renderWeeklyGoals();
        renderDailyGoals();
      }
    }

    function toggleTimer(id) {
      const task = tasks.find(t => t.id === id);
      if (!task || task.remainingSeconds <= 0) return;

      if (task.status === 'running') {
        clearInterval(runningIntervals[id]);
        delete runningIntervals[id];
        task.status = task.remainingSeconds === 0 ? 'completed' : 'not-started';
        task.lastTickTime = null;
      } else {
        task.status = 'running';
        task.lastTickTime = Date.now();
        
        runningIntervals[id] = setInterval(() => {
          updateTimerProgress(id);
        }, 1000);
      }
      
      saveTasks();
      renderTasks();
      renderWeeklyGoals();
      renderDailyGoals();
    }

    function resetTimer(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      if (runningIntervals[id]) {
        clearInterval(runningIntervals[id]);
        delete runningIntervals[id];
      }

      task.remainingSeconds = task.totalSeconds;
      task.status = 'not-started';
      task.lastTickTime = null;
      saveTasks();
      renderTasks();
      renderDailyGoals();
    }

    function deleteTask(id) {
      if (confirm("Are you sure you want to delete this timer?")) {
        if (runningIntervals[id]) {
          clearInterval(runningIntervals[id]);
          delete runningIntervals[id];
        }
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        renderTasks();
        renderWeeklyGoals();
        renderDailyGoals();
      }
    }

    function formatTime(secs) {
      const h = String(Math.floor(secs / 3600)).padStart(2, '0');
      const m = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
      const s = String(secs % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    // Fixed up your cut off section here:
    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';

      let filteredTasks = tasks;
      if (activeFilter === 'today') {
        filteredTasks = tasks.filter(t => t.days.includes(todayIndex));
      }

      if (filteredTasks.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            ${activeFilter === 'today' ? "🎉 No timers scheduled for today!" : "No custom timers created yet."}
          </div>
        `;
        return;
      }

      filteredTasks.forEach(task => {
        const drainedSeconds = task.totalSeconds - task.remainingSeconds;
        const progressPct = Math.min(100, Math.round((drainedSeconds / task.totalSeconds) * 100));
        const dayLabels = task.days.map(d => DAY_NAMES[d]).join(', ');

        let cardStatusClass = 'not-started';
        let statusBadgeText = "RED (NOT STARTED)";
        let actionBtnText = "Start";

        if (task.status === 'running') {
          cardStatusClass = 'running';
          statusBadgeText = "GREEN (WORKING)";
          actionBtnText = "Pause";
        } else if (task.remainingSeconds === 0) {
          cardStatusClass = 'completed';
          statusBadgeText = "GREY (COMPLETE)";
        } else if (drainedSeconds > 0) {
          cardStatusClass = 'in-progress';
          statusBadgeText = "YELLOW (IN PROGRESS)";
          actionBtnText = "Resume";
        }

        const card = document.createElement('div');
        card.className = `task-card status-${cardStatusClass}`;

        card.innerHTML = `
          <div class="task-header">
            <div class="task-title-wrap">
              <span class="task-title">${task.name}</span>
              <button class="btn-edit" onclick="editTask('${task.id}')" title="Edit Timer">✏️</button>
            </div>
            <span class="status-badge">${statusBadgeText}</span>
          </div>
          
          <div class="days-tag">Scheduled: ${dayLabels}</div>

          <div class="progress-container">
            <div class="progress-info">
              <span>Progress</span>
              <span><strong>${progressPct}%</strong></span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width: ${progressPct}%"></div>
            </div>
          </div>

          <div class="timer-row">
            <div class="timer-left-group">
              <div class="timer-display">${formatTime(task.remainingSeconds)}</div>
              <div class="elapsed-box">TIME ELAPSED: ${formatTime(drainedSeconds)}</div>
            </div>
            <div class="controls">
              <button class="btn btn-action" onclick="toggleTimer('${task.id}')">${actionBtnText}</button>
              <button class="btn btn-secondary" onclick="resetTimer('${task.id}')">Reset</button>
              <button class="btn btn-danger" onclick="deleteTask('${task.id}')">Delete</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Dummy functions to prevent errors if they were declared elsewhere
 function renderWeeklyGoals() {
  const summaryContainer = document.getElementById('weekly-summary-container');
  const listContainer = document.getElementById('weekly-goals-container');
  summaryContainer.innerHTML = '';
  listContainer.innerHTML = '';

  const weeklyTasks = tasks.filter(t => t.weeklyGoalHours > 0);

  if (weeklyTasks.length === 0) {
    listContainer.innerHTML = '<div class="empty-state">No weekly goals set.</div>';
    return;
  }

  let totalWeeklySecs = 0;
  let totalWeeklyCompleted = 0;
  let listHTML = '';

  weeklyTasks.forEach(task => {
    const taskWeeklyGoalSecs = task.weeklyGoalHours * 3600;
    totalWeeklySecs += taskWeeklyGoalSecs;
    totalWeeklyCompleted += task.weeklyAccumulatedSecs;

    const progressPct = Math.min(100, Math.round((task.weeklyAccumulatedSecs / taskWeeklyGoalSecs) * 100)) || 0;

    listHTML += `
      <div class="goal-item">
        <div class="goal-item-title">${task.name}</div>
        <div class="progress-info">
          <span>${formatHoursMinutes(task.weeklyAccumulatedSecs)} / ${task.weeklyGoalHours} hrs</span>
          <span>${progressPct}%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill weekly-fill" style="width: ${progressPct}%"></div>
        </div>
      </div>
    `;
  });

  const totalPct = totalWeeklySecs > 0 ? Math.min(100, Math.round((totalWeeklyCompleted / totalWeeklySecs) * 100)) : 0;

  summaryContainer.innerHTML = `
    <div class="goal-summary-card">
      <div class="goal-summary-title">Weekly Total</div>
      <div class="progress-info">
        <span>${formatHoursMinutes(totalWeeklyCompleted)} / ${formatHoursMinutes(totalWeeklySecs)}</span>
        <span>${totalPct}%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill summary-fill" style="width: ${totalPct}%"></div>
      </div>
    </div>
  `;

  listContainer.innerHTML = listHTML;
}

function renderDailyGoals() {
  const summaryContainer = document.getElementById('daily-summary-container');
  const listContainer = document.getElementById('daily-goals-container');
  summaryContainer.innerHTML = '';
  listContainer.innerHTML = '';

  const todaysTasks = tasks.filter(t => t.days.includes(todayIndex));
  
  if (todaysTasks.length === 0) {
    listContainer.innerHTML = '<div class="empty-state">No goals for today.</div>';
    return;
  }

  let totalDailySecs = 0;
  let totalDailyCompleted = 0;
  let listHTML = '';

  todaysTasks.forEach(task => {
    totalDailySecs += task.totalSeconds;
    totalDailyCompleted += task.dailyAccumulatedSecs;

    const progressPct = Math.min(100, Math.round((task.dailyAccumulatedSecs / task.totalSeconds) * 100)) || 0;

    listHTML += `
      <div class="goal-item">
        <div class="goal-item-title">${task.name}</div>
        <div class="progress-info">
          <span>${formatHoursMinutes(task.dailyAccumulatedSecs)} / ${formatHoursMinutes(task.totalSeconds)}</span>
          <span>${progressPct}%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill daily-fill" style="width: ${progressPct}%"></div>
        </div>
      </div>
    `;
  });

  const totalPct = totalDailySecs > 0 ? Math.min(100, Math.round((totalDailyCompleted / totalDailySecs) * 100)) : 0;

  summaryContainer.innerHTML = `
    <div class="goal-summary-card">
      <div class="goal-summary-title">Daily Total</div>
      <div class="progress-info">
        <span>${formatHoursMinutes(totalDailyCompleted)} / ${formatHoursMinutes(totalDailySecs)}</span>
        <span>${totalPct}%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill summary-fill" style="width: ${totalPct}%"></div>
      </div>
    </div>
  `;

  listContainer.innerHTML = listHTML;
}

    /* ========================================================
       FULLSCREEN BEHAVIOR LOGIC
       ======================================================== */
    let fsMode = 'remaining'; // 'remaining' or 'elapsed'
    let fsUpdateInterval = null;

    function openFullscreen() {
      if (tasks.length === 0) {
        alert("Please create a timer on the dashboard first!");
        return;
      }
      
      const overlay = document.getElementById('fs-overlay');
      const select = document.getElementById('fs-timer-select');
      
      // Load current tasks into the dropdown
      select.innerHTML = '';
      tasks.forEach(task => {
        const option = document.createElement('option');
        option.value = task.id;
        option.textContent = task.name;
        select.appendChild(option);
      });

      // Default to picking an already running task, or the first task available
      const activeTask = tasks.find(t => t.status === 'running') || tasks[0];
      select.value = activeTask.id;

      overlay.classList.remove('hidden');
      updateFsDisplay();
      
      // Update the fullscreen timer display every second
      fsUpdateInterval = setInterval(updateFsDisplay, 1000);
    }

    function closeFullscreen() {
      document.getElementById('fs-overlay').classList.add('hidden');
      if (fsUpdateInterval) {
        clearInterval(fsUpdateInterval);
        fsUpdateInterval = null;
      }
    }

    function setFsMode(mode) {
      fsMode = mode;
      document.getElementById('fs-btn-remaining').classList.toggle('active', mode === 'remaining');
      document.getElementById('fs-btn-elapsed').classList.toggle('active', mode === 'elapsed');
      updateFsDisplay();
    }

    function updateFsDisplay() {
      const select = document.getElementById('fs-timer-select');
      const taskId = select.value;
      const task = tasks.find(t => t.id === taskId);
      const display = document.getElementById('fs-huge-timer');

      if (!task) {
        display.textContent = "00:00:00";
        return;
      }

      // Determine what to display based on the toggle switch
      if (fsMode === 'remaining') {
        display.textContent = formatTime(task.remainingSeconds);
      } else {
        const drainedSeconds = task.totalSeconds - task.remainingSeconds;
        display.textContent = formatTime(drainedSeconds);
      }
      
      // Change visual color feedback mirroring the dashboard's green/grey states
      if (task.status === 'running') {
        display.style.color = 'var(--color-running)';
      } else if (task.remainingSeconds === 0) {
        display.style.color = 'var(--color-completed)';
      } else {
        display.style.color = 'var(--text)';
      }
    }

    // Toggle the timer directly from the fullscreen view without closing
    function toggleActiveFsTimer() {
      const select = document.getElementById('fs-timer-select');
      const taskId = select.value;
      
      // Leverage the existing robust toggling logic
      toggleTimer(taskId);
      updateFsDisplay();
    }

    // Initialize the Application
    checkResets();
    renderAgenda();
    renderTasks();
  </script>
