<script>
  const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const todayIndex = new Date().getDay();

  // Data State
  let tasks = JSON.parse(localStorage.getItem('custom_timers_list')) || [];
  let activeFilter = 'today';
  let runningIntervals = {};

  function getWeekIdentifier() {
    const d = new Date();
    const distanceToSat = 6 - d.getDay();
    const saturday = new Date(d);
    saturday.setDate(d.getDate() + distanceToSat);
    saturday.setHours(23, 59, 59, 999);
    return saturday.toDateString();
  }

  function checkResets() {
    const todayStr = new Date().toDateString();
    const currentWeekId = getWeekIdentifier();

    tasks.forEach(task => {
      if (task.lastActiveDate !== todayStr) {
        task.remainingSeconds = task.totalSeconds;
        task.status = 'not-started';
        task.lastActiveDate = todayStr;
        task.lastTickTime = null;
      }

      if (!task.lastResetWeek || task.lastResetWeek !== currentWeekId) {
        task.weeklyAccumulatedSecs = 0;
        task.lastResetWeek = currentWeekId;
      }
    });
    saveTasks();
  }

  function saveTasks() {
    localStorage.setItem('custom_timers_list', JSON.stringify(tasks));
  }

  document.getElementById('today-display').textContent = 
    `Today is ${new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' })}`;

  document.getElementById('add-task-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('task-name-input').value.trim();
    const weeklyGoal = parseFloat(document.getElementById('weekly-goal-input').value) || 0;
    const hrs = parseInt(document.getElementById('hours-input').value) || 0;
    const mins = parseInt(document.getElementById('mins-input').value) || 0;
    
    const selectedDays = Array.from(document.querySelectorAll('.day-check:checked'))
                             .map(cb => parseInt(cb.value));

    if (hrs === 0 && mins === 0) {
      alert("Please set a daily duration greater than 0.");
      return;
    }

    if (selectedDays.length === 0) {
      alert("Please select at least one day for this timer.");
      return;
    }

    const totalSeconds = (hrs * 3600) + (mins * 60);

    const newTask = {
      id: 'task_' + Date.now(),
      name: name,
      totalSeconds: totalSeconds,
      remainingSeconds: totalSeconds,
      weeklyGoalHours: weeklyGoal,
      weeklyAccumulatedSecs: 0,
      days: selectedDays,
      status: 'not-started',
      lastActiveDate: new Date().toDateString(),
      lastResetWeek: getWeekIdentifier(),
      lastTickTime: null
    };

    tasks.push(newTask);
    saveTasks();
    renderTasks();
    renderWeeklyGoals();

    document.getElementById('add-task-form').reset();
    document.querySelectorAll('.day-check').forEach((cb, idx) => cb.checked = idx < 4);
  });

  function setFilter(filter) {
    activeFilter = filter;
    document.getElementById('filter-today').classList.toggle('active', filter === 'today');
    document.getElementById('filter-all').classList.toggle('active', filter === 'all');
    renderTasks();
  }

  // Core Timestamp Calculation Update
  function updateTimerProgress(id) {
    const task = tasks.find(t => t.id === id);
    if (!task || task.status !== 'running') return;

    const now = Date.now();
    if (!task.lastTickTime) {
      task.lastTickTime = now;
      return;
    }

    // Calculate elapsed real time in seconds
    const elapsedSecs = Math.floor((now - task.lastTickTime) / 1000);

    if (elapsedSecs >= 1) {
      // Advance by actual elapsed time
      const actualDeduction = Math.min(task.remainingSeconds, elapsedSecs);
      
      task.remainingSeconds -= actualDeduction;
      task.weeklyAccumulatedSecs += actualDeduction;
      
      // Advance lastTickTime by the exact seconds accounted for
      task.lastTickTime += actualDeduction * 1000;

      if (task.remainingSeconds <= 0) {
        clearInterval(runningIntervals[id]);
        delete runningIntervals[id];
        task.status = 'completed';
        task.remainingSeconds = 0;
        task.lastTickTime = null;
        alert(`🎉 "${task.name}" is fully drained for today!`);
      }

      saveTasks();
      renderTasks();
      renderWeeklyGoals();
    }
  }

  function toggleTimer(id) {
    const task = tasks.find(t => t.id === id);
    if (!task || task.remainingSeconds <= 0) return;

    if (task.status === 'running') {
      clearInterval(runningIntervals[id]);
      delete runningIntervals[id];
      task.status = task.remainingSeconds === 0 ? 'completed' : 'not-started';
      task.lastTickTime = null;
    } else {
      task.status = 'running';
      task.lastTickTime = Date.now();
      
      runningIntervals[id] = setInterval(() => {
        updateTimerProgress(id);
      }, 1000);
    }
    
    saveTasks();
    renderTasks();
    renderWeeklyGoals();
  }

  function resetTimer(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;

    if (runningIntervals[id]) {
      clearInterval(runningIntervals[id]);
      delete runningIntervals[id];
    }

    task.remainingSeconds = task.totalSeconds;
    task.status = 'not-started';
    task.lastTickTime = null;
    saveTasks();
    renderTasks();
  }

  function deleteTask(id) {
    if (confirm("Are you sure you want to delete this timer?")) {
      if (runningIntervals[id]) {
        clearInterval(runningIntervals[id]);
        delete runningIntervals[id];
      }
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
      renderWeeklyGoals();
    }
  }

  function formatTime(secs) {
    const h = String(Math.floor(secs / 3600)).padStart(2, '0');
    const m = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
    const s = String(secs % 60).padStart(2, '0');
    return `${h}:${m}:${s}`;
  }

  function formatHoursMinutes(totalSecs) {
    const h = (totalSecs / 3600).toFixed(1);
    return `${h} hrs`;
  }

  function renderTasks() {
    const container = document.getElementById('tasks-container');
    container.innerHTML = '';

    let filteredTasks = tasks;
    if (activeFilter === 'today') {
      filteredTasks = tasks.filter(t => t.days.includes(todayIndex));
    }

    if (filteredTasks.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          ${activeFilter === 'today' ? "🎉 No timers scheduled for today!" : "No custom timers created yet."}
        </div>
      `;
      return;
    }

    filteredTasks.forEach(task => {
      const drainedSeconds = task.totalSeconds - task.remainingSeconds;
      const progressPct = Math.min(100, Math.round((drainedSeconds / task.totalSeconds) * 100));
      const dayLabels = task.days.map(d => DAY_NAMES[d]).join(', ');

      const card = document.createElement('div');
      card.className = `task-card status-${task.status}`;

      let statusText = "Red (Not Started)";
      if (task.status === 'running') statusText = "Green (Working)";
      if (task.status === 'completed') statusText = "Grey (Complete)";

      card.innerHTML = `
        <div class="task-header">
          <span class="task-title">${task.name}</span>
          <span class="status-badge">${statusText}</span>
        </div>
        
        <div class="days-tag">Scheduled: ${dayLabels}</div>

        <div class="progress-container">
          <div class="progress-info">
            <span>Progress</span>
            <span><strong>${progressPct}%</strong></span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width: ${progressPct}%"></div>
          </div>
        </div>

        <div class="timer-row">
          <div class="timer-display">${formatTime(task.remainingSeconds)}</div>
          <div class="controls">
            ${task.status !== 'completed' ? `
              <button class="btn btn-action" onclick="toggleTimer('${task.id}')">
                ${task.status === 'running' ? 'Pause' : 'Start'}
              </button>
            ` : ''}
            <button class="btn btn-secondary" onclick="resetTimer('${task.id}')">Reset</button>
            <button class="btn btn-danger" onclick="deleteTask('${task.id}')">🗑️</button>
          </div>
        </div>
      `;

      container.appendChild(card);
    });
  }

  function renderWeeklyGoals() {
    const container = document.getElementById('weekly-goals-container');
    container.innerHTML = '';

    if (tasks.length === 0) {
      container.innerHTML = `<div class="empty-state">No goals set yet.</div>`;
      return;
    }

    tasks.forEach(task => {
      const goalSecs = (task.weeklyGoalHours || 1) * 3600;
      const currentSecs = task.weeklyAccumulatedSecs || 0;
      const pct = Math.min(100, Math.round((currentSecs / goalSecs) * 100));

      const item = document.createElement('div');
      item.className = 'weekly-item';
      item.innerHTML = `
        <div class="weekly-item-title">${task.name}</div>
        <div class="progress-info">
          <span>Done: ${formatHoursMinutes(currentSecs)}</span>
          <span>Goal: ${task.weeklyGoalHours} hrs (${pct}%)</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill weekly-fill" style="width: ${pct}%"></div>
        </div>
      `;
      container.appendChild(item);
    });
  }

  // Resume any timers that were left running across refreshes/returns
  tasks.forEach(task => {
    if (task.status === 'running') {
      task.lastTickTime = Date.now();
      runningIntervals[task.id] = setInterval(() => updateTimerProgress(task.id), 1000);
    }
  });

  checkResets();
  renderTasks();
  renderWeeklyGoals();
</script>
